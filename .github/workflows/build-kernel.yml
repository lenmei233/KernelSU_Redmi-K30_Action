name: Build Kernel

on:
  watch:
    types: [started]
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source'
        required: true
        default: 'https://github.com/lenmei233/kernel_xiaomi_sm7250'
      KERNEL_SOURCE_BRANCH:
        description: 'Branch'
        required: true
        default: 'android-4.19'
      KERNEL_DEFCONFIG:
        description: 'Defconfig'
        required: true
        default: 'vendor/picasso_user_defconfig'
      KERNEL_FILE:
        description: 'Kernel out image name'
        required: true
        default: 'Image.gz-dtb'
      CLANG_VERSION:
        description: 'Clang version'
        required: true
        default: 'r450784d'
      BUILD_EXTRA_COMMAND:
        description: 'Extra build commands'
        required: false
        default: 'LD=ld.lld LLVM=1 LLVM_IAS=1'
      DISABLE_LTO:
        description: 'Disable LTO'
        required: false
        default: 'true'
        type: boolean
      USE_KERNELSU:
        description: 'Use KernelSU'
        required: true
        default: 'true'
        type: boolean
      USE_KPROBES:
        description: 'Use Kprobes'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - uses: actions/checkout@v4

    - name: Setup Configuration
      run: |
        if [ "$(grep 'USE_CONFIG' config.env | head -n1 | cut -d'=' -f2)" = "true" ]; then
            echo "KERNEL_SOURCE=$(grep 'KERNEL_SOURCE' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
            echo "KERNEL_SOURCE_BRANCH=$(grep 'KERNEL_SOURCE_BRANCH' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
            echo "KERNEL_DEFCONFIG=$(grep 'KERNEL_DEFCONFIG' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_HOST
            echo "KERNEL_DEFCONFIG=$(grep 'KERNEL_DEFCONFIG' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
            echo "KERNEL_FILE=$(grep 'KERNEL_FILE' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
            echo "CLANG_VERSION=$(grep 'CLANG_VERSION' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
            echo "BUILD_EXTRA_COMMAND=$(grep 'EXTRA_CMDS' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
            echo "DISABLE-LTO=$(grep 'DISABLE-LTO' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
            echo "USE_KERNELSU=$(grep 'USE_KERNELSU' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
            echo "USE_KPROBES=$(grep 'USE_KPROBES' config.env | head -n1 | cut -d'=' -f2)" >> $GITHUB_ENV
        else
            echo "KERNEL_SOURCE=${{ github.event.inputs.KERNEL_SOURCE }}" >> $GITHUB_ENV
            echo "KERNEL_SOURCE_BRANCH=${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}" >> $GITHUB_ENV
            echo "KERNEL_DEFCONFIG=${{ github.event.inputs.KERNEL_DEFCONFIG }}" >> $GITHUB_ENV
            echo "KERNEL_FILE=${{ github.event.inputs.KERNEL_FILE }}" >> $GITHUB_ENV
            echo "CLANG_VERSION=${{ github.event.inputs.CLANG_VERSION }}" >> $GITHUB_ENV
            echo "BUILD_EXTRA_COMMAND=${{ github.event.inputs.BUILD_EXTRA_COMMAND }}" >> $GITHUB_ENV
            echo "DISABLE-LTO=${{ github.event.inputs.DISABLE-LTO }}" >> $GITHUB_ENV
            echo "USE_KERNELSU=${{ github.event.inputs.USE_KERNELSU }}" >> $GITHUB_ENV
            echo "USE_KPROBES=${{ github.event.inputs.USE_KPROBES }}" >> $GITHUB_ENV
        fi

    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DEVICE=$(echo ${{ env.KERNEL_DEFCONFIG }} | sed 's!vendor/!!;s/_defconfig//;s/_user//;s/-perf//')" >> $GITHUB_ENV
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison gperf build-essential \
          zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 \
          libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush \
          schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev \
          pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl \
          libxml-simple-perl bc libc6-dev-i386 lib32ncurses-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler \
          python3 gcc-multilib g++-multilib
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Download Clang-aosp and Gcc-aosp
      run: |
        cd $GITHUB_WORKSPACE
        mkdir -p kernel_workspace && cd kernel_workspace
        mkdir -p clang-aosp gcc-aosp

        # Clang r450784d —— 用 android13-qpr2-release 分支的 +archive 直链（避开 master-kernel-build-2022 的 400）
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-qpr2-release/clang-${{ env.CLANG_VERSION }}.tar.gz" -O clang.tar.gz
        tar -xzf clang.tar.gz -C clang-aosp

        # GCC aarch64 4.9
        wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r35.tar.gz" -O gcc.tar.gz
        tar -xzf gcc.tar.gz -C gcc-aosp

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Setup KernelSU
      if: env.USE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
        if [ "${{ env.USE_KPROBES }}" = "true" ]; then
            echo "CONFIG_MODULES=y" >> arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
            echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
            echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
            echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
        fi
        if [ "${{ env.DISABLE-LTO }}" = "true" ]; then
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
            sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
            echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}
        fi

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        make -j$(nproc --all) O=out ARCH=arm64 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc-aosp/bin/aarch64-linux-android- \
          CC=clang ${{ env.BUILD_EXTRA_COMMAND }} ${{ env.KERNEL_DEFCONFIG }}
        make -j$(nproc --all) O=out ARCH=arm64 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc-aosp/bin/aarch64-linux-android- \
          CC=clang ${{ env.BUILD_EXTRA_COMMAND }}

    - name: Make AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/${{ env.KERNEL_FILE }} AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-KernelSU-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/AnyKernel3/*
